# Generate llms.txt from .github/templates/llms.txt.tpl via the
# qte77/gha-llms-txt-action composite action. The action opens a PR with
# the regenerated file instead of pushing straight to main, since main's
# branch rules reject direct pushes.
# See: https://llmstxt.org/
name: write-llms-txt

on:
  push:
    branches: [main]
    paths:
      - ".github/templates/llms.txt.tpl"
      - "README.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  write-llms-txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: qte77/gha-llms-txt-action@7cb4f03bd69a23c0e561ce76e926cadc0d3d3b9f  # v0.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
