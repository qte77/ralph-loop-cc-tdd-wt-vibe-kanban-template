---
# https://github.blog/changelog/2025-10-28-upcoming-deprecation-of-codeql-action-v3/
name: "CodeQL"

on:
  push:
  pull_request:
  schedule:
    - cron: '27 11 * * 0'
  workflow_dispatch:

# --- Estate exception: pull_request trigger is DELIBERATE and sanctioned ---
# Standard estate policy runs CodeQL on push only. This repo adds pull_request
# because branch protection requires a passing CodeQL status on the PR
# merge-ref, and push-only CodeQL runs against the branch HEAD — a different
# SHA — leaving those status checks permanently BLOCKED on inbound PRs.
# Adding pull_request fixes the status-check gap. The concurrency group below
# (cancel-in-progress: true) tames the merge-ref-SHA churn that the push-only
# variant was originally designed to avoid.
# -------------------------------------------------------------------------
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
      with:
        languages: ${{ vars.CODEQL_LANGUAGES || 'python' }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
      with:
        output: sarif-results

    - name: Dismiss alerts with inline suppression comments
      uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8  # v2.0.3
      with:
        sarif-id: ${{ steps.analyze.outputs.sarif-id }}
        sarif-file: sarif-results
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
