---
# Dependabot — uv ecosystem variant.
# Drop into .github/dependabot.yml of a repo that ships uv.lock.
# Grouped per ecosystem (patterns: ["*"]) so each ecosystem's weekly updates
# land as one reviewable PR — matches the exemplars qte77/analyze-stock-kpi and
# qte77/gha-sec-feed. Note: Dependabot groups are per-ecosystem; uv and
# github-actions remain separate PRs.
# Cooldown: version updates skip releases younger than 7 days (a supply-chain
# delay). Security updates are never delayed: cooldown applies to version
# updates only (Dependabot options reference, `cooldown`).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
